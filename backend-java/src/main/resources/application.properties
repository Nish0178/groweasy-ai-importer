# ==========================================
# GrowEasy AI Importer - Java Backend Config
# ==========================================

spring.application.name=groweasy-ai-importer

# Server port (defaults to 5000 to match TypeScript backend, or set via PORT environment variable)
server.port=${PORT:5000}

# Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Storage Paths
storage.uploads-dir=uploads
storage.exports-dir=exports

# Logging
logging.level.com.groweasy.importer=INFO
logging.level.org.springframework.web=INFO
